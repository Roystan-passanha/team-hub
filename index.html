<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Team Hub</title>
  <meta name="description" content="Project tracker, action tracker, weekly updates and handover log for small teams. Free, no sign-up.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%232f7df6'/><path d='M18 33l9 9 19-21' stroke='white' stroke-width='6' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="shell">
    <aside class="nav">
      <div class="brand"><span class="brand__mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M6 12.5l4 4 8-9" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span>Team Hub</span></div>
      <nav id="tabs" aria-label="Sections">
        <button data-view="overview" class="tab"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="5" rx="2"/><rect x="13" y="10" width="8" height="11" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/></svg><span>Overview</span></button>
        <button data-view="projects" class="tab"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="5" height="16" rx="1.5"/><rect x="9.5" y="4" width="5" height="11" rx="1.5"/><rect x="16" y="4" width="5" height="7" rx="1.5"/></svg><span>Projects</span><b id="n-projects"></b></button>
        <button data-view="actions" class="tab"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6.5l2 2 3-3.5M4 13.5l2 2 3-3.5M12 7h8M12 14h8M5 20h15" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Actions</span><b id="n-actions"></b></button>
        <button data-view="updates" class="tab"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z" fill="none" stroke-width="2" stroke-linejoin="round"/></svg><span>Updates</span><b id="n-updates"></b></button>
        <button data-view="handovers" class="tab"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h13m0 0l-3.5-3.5M17 8l-3.5 3.5M20 16H7m0 0l3.5-3.5M7 16l3.5 3.5" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Handovers</span><b id="n-handovers"></b></button>
      </nav>
      <div class="nav__foot">
        <label class="me">Viewing as<select id="me"></select></label>
        <button class="btn btn--quiet" id="btn-team">Team and data</button>
        <button class="btn btn--quiet" id="btn-theme">Light mode</button>
      </div>
    </aside>

    <main class="main">
      <header class="head">
        <div><h1 id="title"></h1><p id="subtitle" class="muted"></p></div>
        <div id="head-actions" class="head__actions"></div>
      </header>
      <p id="banner" class="banner" hidden></p>
      <div id="toolbar" class="toolbar"></div>
      <div id="view"></div>
      <footer class="foot muted">Built by Roystan Passanha. Data on this page is saved in this browser only. <a href="https://github.com/Roystan-passanha/team-hub">Source code</a></footer>
    </main>
  </div>

  <dialog id="dlg" aria-labelledby="dlg-title">
    <form id="dlg-form" method="dialog" novalidate>
      <div class="dlg__head"><h2 id="dlg-title"></h2><button type="button" class="btn btn--quiet" id="dlg-x" aria-label="Close">Close</button></div>
      <div id="dlg-body" class="dlg__body"></div>
      <p id="dlg-error" class="error" role="alert" hidden></p>
      <div id="dlg-foot" class="dlg__foot"></div>
    </form>
  </dialog>
  <div id="toast" class="toast" role="status" hidden></div>
  <input id="import-file" type="file" accept=".json,application/json" hidden>
  <script type="module" src="js/app.js"></script>
</body>
</html>
